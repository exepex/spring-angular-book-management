name: stagr-s-probe-pr
# Throwaway probe for exepex/agentic-foundation#249 (facts 1, 3 and 6). Deleted when item S is done.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number whose concurrency group this run joins
        required: true
        type: string

permissions: {}

concurrency:
  group: stagr-probe-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

jobs:
  probe-work:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Record start
        env:
          EVENT_ACTION: ${{ github.event.action }}
        run: echo "START $(date -u +%FT%TZ) event=$GITHUB_EVENT_NAME action=$EVENT_ACTION run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"

      - name: Check out the head commit (fact 3)
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify head, stored credentials and token scope (fact 3)
        if: github.event_name == 'pull_request_target'
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          actual_sha=$(git rev-parse HEAD)
          echo "FACT3 head=$actual_sha expected=$EXPECTED_SHA"
          if git config --local --get-regexp '^http\..*extraheader' >/dev/null; then echo "FACT3 stored_credentials=yes"; else echo "FACT3 stored_credentials=no"; fi
          if grep -rqsF "$GH_TOKEN" .git; then echo "FACT3 token_in_git_dir=yes"; else echo "FACT3 token_in_git_dir=no"; fi
          write_status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/git/refs" \
            -d "{\"ref\":\"refs/heads/stagr-probe-write-$GITHUB_RUN_ID\",\"sha\":\"$EXPECTED_SHA\"}")
          echo "FACT3 write_attempt_http_status=$write_status"

      - name: Hold the run open so overlaps would show (facts 1 and 6)
        run: sleep 90

      - name: Record end
        run: echo "END $(date -u +%FT%TZ) run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"

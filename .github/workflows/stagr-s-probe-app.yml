name: stagr-s-probe-app
# Throwaway probe for exepex/agentic-foundation#249 (doc 09 capability 7: does a result written by
# the Stagr App wake another workflow?). stagr-s-probe-checks logs the check_run event it raises.
# Deleted when item S is done.
on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Commit the Stagr App writes a result for
        required: true
        type: string

permissions: {}

jobs:
  write-result-as-stagr-app:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Show the App's and the installation's permissions
        env:
          APP_ID: 5125793
          APP_PRIVATE_KEY: ${{ secrets.STAGR_APP_PRIVATE_KEY }}
          REPO: ${{ github.repository }}
        run: |
          key_file=$(mktemp) && printf '%s' "$APP_PRIVATE_KEY" > "$key_file"
          base64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          header=$(printf '{"alg":"RS256","typ":"JWT"}' | base64url)
          payload=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now - 60)) $((now + 540)) "$APP_ID" | base64url)
          signature=$(printf '%s.%s' "$header" "$payload" | openssl dgst -sha256 -sign "$key_file" | base64url)
          rm -f "$key_file"
          app_jwt="$header.$payload.$signature"
          echo "::add-mask::$app_jwt"
          curl -s -H "Authorization: Bearer $app_jwt" -H "Accept: application/vnd.github+json" https://api.github.com/app \
            | jq -c '{APP: .slug, id, owner: .owner.login, permissions}'
          curl -s -H "Authorization: Bearer $app_jwt" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/installation" \
            | jq -c '{INSTALLATION: .id, account: .account.login, permissions, repository_selection, suspended_at}'

      - name: Create a Stagr App token
        id: app-token
        uses: actions/create-github-app-token@c1a285145b9d317df6ced56c09f525b5c2b6f755  # v1.11.1
        with:
          app-id: 5125793
          private-key: ${{ secrets.STAGR_APP_PRIVATE_KEY }}

      - name: Show what the Stagr App token may do
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api -i /installation/repositories --jq '"CAP7 repositories=\([.repositories[].full_name])"' \
            | grep -iE '^(x-oauth-scopes|x-accepted-github-permissions|github-authentication-token-expiration)|CAP7' || true
          gh api -i -X POST "repos/${{ github.repository }}/check-runs" -f name=probe -f head_sha=0000000000000000000000000000000000000000 2>&1 \
            | grep -iE '^(HTTP/|x-accepted-github-permissions)' || true

      - name: Write a completed result as the Stagr App
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          gh api -X POST "repos/$REPO/check-runs" \
            -f name="stagr/stage/probe" -f head_sha="$HEAD_SHA" \
            -f status=completed -f conclusion=success \
            --jq '"CAP7 wrote check_run=\(.id) app=\(.app.slug) app_id=\(.app.id) head=\(.head_sha)"'

name: stagr-s-probe-checks
# Throwaway probe for exepex/agentic-foundation#249 (facts 4 and 5). Deleted when item S is done.
on:
  check_run:
    types: [created, rerequested, completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit whose check runs are listed
        required: true
        type: string
      check_name:
        description: Check run name to count
        required: true
        type: string

permissions: {}

jobs:
  log-check-run-event:
    if: github.event_name == 'check_run'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Log the check run that woke this workflow (fact 5)
        env:
          EVENT_ACTION: ${{ github.event.action }}
          CHECK_NAME: ${{ github.event.check_run.name }}
          APP_SLUG: ${{ github.event.check_run.app.slug }}
          APP_ID: ${{ github.event.check_run.app.id }}
          HEAD_SHA: ${{ github.event.check_run.head_sha }}
          PULL_REQUESTS: ${{ toJSON(github.event.check_run.pull_requests.*.number) }}
        run: echo "FACT5 action=$EVENT_ACTION name=$CHECK_NAME app=$APP_SLUG app_id=$APP_ID head=$HEAD_SHA pull_requests=$PULL_REQUESTS"

  count-latest-check-runs:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
      - name: Count check runs with filter latest and all (fact 4)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
          CHECK_NAME: ${{ inputs.check_name }}
        run: |
          for filter in latest all; do
            runs=$(gh api -X GET "repos/$REPO/commits/$SHA/check-runs" -f check_name="$CHECK_NAME" -f filter="$filter" \
              --jq '[.check_runs[] | {id, app_id: .app.id, status, conclusion}]')
            echo "FACT4 filter=$filter runs=$runs"
          done
          for check_run_id in $(gh api -X GET "repos/$REPO/commits/$SHA/check-runs" -f check_name="$CHECK_NAME" -f filter=all --jq '.check_runs[].id'); do
            annotations=$(gh api "repos/$REPO/check-runs/$check_run_id/annotations" --jq '[.[] | .message]')
            echo "FACT2 check_run=$check_run_id annotations=$annotations"
          done

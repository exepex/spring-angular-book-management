name: stagr-s-probe-outcomes
# Throwaway probe for exepex/agentic-foundation#249 (fact 2). Deleted when item S is done.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: How the work job ends
        required: true
        type: choice
        options: [success, failure, timeout, cancelled, skipped]

permissions: {}

jobs:
  work:
    if: inputs.mode != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.mode == 'timeout' && 1 || 5 }}
    permissions:
      actions: write  # only used by mode "cancelled", to cancel this run
    steps:
      - name: End the work the requested way
        env:
          MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          case "$MODE" in
            success) echo "work succeeded" ;;
            failure) exit 1 ;;
            timeout) sleep 300 ;;
            cancelled)
              curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/actions/runs/$GITHUB_RUN_ID/cancel"
              sleep 120 ;;
          esac

  publish:
    needs: work
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report the work result
        env:
          MODE: ${{ inputs.mode }}
          WORK_RESULT: ${{ needs.work.result }}
        run: echo "FACT2 mode=$MODE needs.work.result=$WORK_RESULT"
